[project]
name = "erasure-tensor-network-decoder"
version = "0.1.0"
description = "Tensor Network Decoder for Erasure Errors in Quantum Error Correction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "quimb>=1.8.0",
    "autoray>=0.6.0",
    "matplotlib>=3.7.0",
    "scipy>=1.10.0",
    "ldpc",
    "torch",
]

[project.optional-dependencies]
cudaqx = [
    "cudaq-qec",
]
stim = [
    "stim>=1.13.0",
    "beliefmatching>=0.2.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
all = [
    "erasure-tensor-network-decoder[cudaqx,stim,dev]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
